name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the verify pipeline only needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # lint -> typecheck -> build -> test (the documented pre-merge gate).
      - run: npm run verify

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Build the image (no push) so a Dockerfile regression fails CI.
      - run: docker build -t swissknife-mcp:ci .
