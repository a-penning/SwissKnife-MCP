name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the verify pipeline only needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # lint -> typecheck -> build -> test (the documented pre-merge gate).
      - run: npm run verify

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Build the image (no push) so a Dockerfile regression fails CI.
      - run: docker build -t swissknife-mcp:ci .

  dependency-review:
    # Flag PRs that introduce known-vulnerable dependencies. Non-blocking:
    # the action hard-errors ("Dependency review is not supported on this
    # repository") until the repo's Dependency graph is enabled in Settings →
    # Code security, which would otherwise fail every PR. Enable the graph,
    # then drop continue-on-error to make this gate enforcing again.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
